<!doctype html>
<html>
<head><meta charset="utf-8"><title>galaxy_collisions — standing assertions</title>
<style>body{background:#111;color:#ddd;font:13px/1.5 ui-monospace,Menlo,monospace;padding:1rem}
pre{white-space:pre-wrap}</style></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { report } from './harness.js';
import { runPhysicsTests } from './physics.test.js';
import { runGpuTests, createDevice } from './gpu.test.js';
import { runMorphologyTests } from './morphology.test.js';
import { runAdjointTests } from './adjoint.test.js';

const el = document.getElementById('out');
try {
  runPhysicsTests();
  runAdjointTests();
  report(el);                              // show CPU results before the slow GPU pass
  const { device, info } = await createDevice();
  device.addEventListener?.('uncapturederror', (e) => console.error('GPU', e.error.message));
  await runGpuTests(device, info);
  report(el);
  await runMorphologyTests(device);
  report(el);
} catch (e) {
  el.textContent += '\n\nHARNESS EXCEPTION\n' + (e.stack || e.message);
  globalThis.__testResults = { total: 0, failed: 1, complete: false, error: String(e.stack || e.message) };
}
globalThis.__testsDone = true;
</script>
</body>
</html>
